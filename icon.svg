<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1e293b"/>
  <!-- DAG：三个节点两条依赖边 -->
  <line x1="20" y1="20" x2="32" y2="40" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="44" y1="20" x2="32" y2="40" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="20" cy="18" r="7" fill="#38bdf8"/>
  <circle cx="44" cy="18" r="7" fill="#38bdf8"/>
  <circle cx="32" cy="44" r="9" fill="#22c55e"/>
  <!-- 完成勾：验收语义 -->
  <path d="M27 44 l4 4 l7 -8" fill="none" stroke="#052e16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
